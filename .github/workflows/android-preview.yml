name: Next Android compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'
permissions:
  contents: read
jobs:
  next-platform:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - run: bash ./gradlew --no-daemon --max-workers=2 -PandroidCompileSdk=37 -PandroidTargetSdk=37 :android:assembleDebug :android:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 37
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash ./gradlew --no-daemon --max-workers=2 -PandroidCompileSdk=37 -PandroidTargetSdk=37 :android:connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: next-android-compatibility
          path: |
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
