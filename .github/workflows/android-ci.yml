name: Android checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, unit tests and lint
        run: bash ./gradlew --no-daemon --max-workers=2 :android:assembleDebug :android:testDebugUnitTest :android:lintDebug :android:assembleDebugAndroidTest :baselineprofile:assembleNonMinifiedRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/build/reports/tests/
            android/build/reports/lint-results-debug.*
  device:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash ./gradlew --no-daemon --max-workers=2 :android:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-reports-api-${{ matrix.api }}
          path: |
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
