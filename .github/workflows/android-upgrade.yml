name: Signed APK upgrade smoke test
on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: Public URL of the signed candidate APK
        required: true
        type: string
      candidate_sha256:
        description: Expected candidate SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [21, 28, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Download public APKs and verify candidate checksum
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        shell: python
        run: |
          import hashlib, os, pathlib, re, urllib.request
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['CANDIDATE_SHA256'])
          assert os.environ['CANDIDATE_URL'].startswith('https://')
          for url, name in [('https://github.com/mattzilla30/MBooru/releases/download/1/MBooru-1.apk', 'previous.apk'), (os.environ['CANDIDATE_URL'], 'candidate.apk')]:
              with urllib.request.urlopen(url, timeout=60) as response:
                  pathlib.Path(name).write_bytes(response.read())
          assert hashlib.sha256(pathlib.Path('candidate.apk').read_bytes()).hexdigest() == os.environ['CANDIDATE_SHA256']
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/signed_upgrade.py previous.apk candidate.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --out build/upgrade/api-${{ matrix.api }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: signed-upgrade-api-${{ matrix.api }}
          path: build/upgrade/*.json
