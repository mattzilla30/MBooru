name: Publish signed Android release
on:
  workflow_dispatch:
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/android-ci.yml
  build:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure signing
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          names = ('KEY_ALIAS', 'KEY_PASSWORD', 'KEYSTORE_BASE64', 'KEYSTORE_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure all four signing secrets before running this workflow.')
          directory = pathlib.Path('.gradle')
          directory.mkdir(exist_ok=True)
          (directory / 'mbooru-release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:')
          fields = {'KEY_ALIAS': 'KEY_ALIAS', 'KEY_PASS': 'KEY_PASSWORD', 'STORE_PASS': 'KEYSTORE_PASSWORD'}
          (directory / 'keystore.properties').write_text(''.join(key + '=' + escape(os.environ[name]) + '\n' for key, name in fields.items()))
      - name: Build release APK
        run: |
          python3 scripts/check_release.py
          bash ./gradlew --no-daemon --max-workers=2 :android:assembleRelease cyclonedxBom
          python3 scripts/check_apk.py android/build/outputs/apk/release/android-release.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --expected-certificate docs/release-signing-certificate.sha256
          python3 scripts/release_provenance.py android/build/outputs/apk/release/android-release.apk --source "$GITHUB_SHA" --out android/build/outputs/apk/release/provenance.json
          sha256sum android/build/outputs/apk/release/android-release.apk > android/build/outputs/apk/release/SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MBooru-signed-apk
          path: |
            android/build/outputs/apk/release/*.apk
            android/build/outputs/apk/release/provenance.json
            android/build/outputs/apk/release/SHA256SUMS
            build/reports/cyclonedx/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("android/build/outputs/apk/release/output-metadata.json").read_text())["elements"][0]["versionName"])')
          cp android/build/outputs/apk/release/android-release.apk "MBooru-${VERSION}.apk"
          sha256sum "MBooru-${VERSION}.apk" > SHA256SUMS
          gh release create "$VERSION" "MBooru-${VERSION}.apk" SHA256SUMS \
            android/build/outputs/apk/release/provenance.json \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file "docs/releases/${VERSION}.md"
      - name: Remove signing files
        if: always()
        run: rm -f .gradle/mbooru-release.jks .gradle/keystore.properties
